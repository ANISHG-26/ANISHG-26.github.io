<header class="site-header{% if page.url == '/' %} home-header{% endif %}">
  <a class="wordmark identity-terminal" href="{{ '/about/' | relative_url }}" aria-label="About Anish George">
    <span class="prompt-mark" aria-hidden="true">&gt;_</span>
    <span class="terminal-prompt">~/ag</span>
  </a>

  <nav class="desktop-nav" aria-label="Primary navigation">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    <a href="{{ '/experience/' | relative_url }}"{% if page.url == '/experience/' %} aria-current="page"{% endif %}>Experience</a>
    <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/field-notes/' | relative_url }}"{% if page.url contains '/field-notes/' %} aria-current="page"{% endif %}>Field Notes</a>
    <a href="{{ '/geek-out/' | relative_url }}"{% if page.url == '/geek-out/' %} aria-current="page"{% endif %}>Geek Out</a>
  </nav>

  <div class="header-controls">
    <div class="theme-switcher" role="group" aria-label="Colour theme">
      <button type="button" data-theme-option="light" aria-label="Use light theme" title="Light theme" aria-pressed="false"><i data-lucide="sun" aria-hidden="true"></i></button>
      <button type="button" data-theme-option="dark" aria-label="Use dark theme" title="Dark theme" aria-pressed="false"><i data-lucide="moon" aria-hidden="true"></i></button>
    </div>
    <button class="motion-switcher" type="button" data-motion-toggle aria-label="Turn animations off" title="Animations on" aria-pressed="true"><i data-lucide="pause" aria-hidden="true"></i></button>
  </div>
</header>
